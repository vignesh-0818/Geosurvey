<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - GeoSurvey Pro</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="coming-soon">
    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" style="position:fixed;top:1.5rem;right:1.5rem;z-index:10;"><i class="bi bi-moon"></i></button>
    <div class="coming-soon-content">
      <div class="coming-soon-logo mb-4">
        <i class="bi bi-compass" style="font-size:3rem;color:var(--primary);"></i>
      </div>
      <h1 class="mb-3" style="font-family:'Playfair Display',serif;font-weight:700;">GeoSurvey Pro</h1>
      <h2 class="mb-4" style="font-family:'Playfair Display',serif;font-weight:600;">Coming Soon</h2>
      <p class="mb-5" style="font-size:1.1rem;color:var(--text-secondary);max-width:500px;margin-left:auto;margin-right:auto;">We're working on something new. Our new surveying portal will launch soon with enhanced features and services.</p>

      <div class="countdown-timer mb-5" id="countdown">
        <div class="countdown-item">
          <span class="countdown-number" id="days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="minutes">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="seconds">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

      <div class="coming-soon-form mx-auto" style="max-width:480px;">
        <h5 class="mb-3">Get Notified When We Launch</h5>
        <form id="comingSoonForm" onsubmit="handleComingSoonForm(event)">
          <div class="input-group">
            <input type="email" class="form-control" id="notifyEmail" placeholder="Enter your email address" required>
            <button class="btn btn-primary-custom" type="submit">Notify Me</button>
          </div>
        </form>
        <div id="comingSoonSuccess" class="mt-3" style="display:none;">
          <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>We'll notify you when we launch!</div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script>
    function initCountdown() {
      const now = new Date();
      const target = new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);

      function update() {
        const diff = target - new Date();
        if (diff <= 0) return;
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('days').textContent = String(d).padStart(2, '0');
        document.getElementById('hours').textContent = String(h).padStart(2, '0');
        document.getElementById('minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('seconds').textContent = String(s).padStart(2, '0');
      }
      update();
      setInterval(update, 1000);
    }

    function handleComingSoonForm(e) {
      e.preventDefault();
      document.getElementById('comingSoonForm').style.display = 'none';
      document.getElementById('comingSoonSuccess').style.display = 'block';
    }

    initTheme();
    initRTL();
    initCountdown();
  </script>
</body>
</html>
